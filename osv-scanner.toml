# OSV Scanner ignore list for findings with no practical/patched fix.
# Prefer dependency upgrades over ignores when a fixed version exists, and remove an entry
# as soon as the dependency is gone or fixed (a stale ignore would hide a regression).
#
# (The previous extract-zip exceptions (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3) went away when
# Electron was upgraded to 41.x, which no longer depends on it.)
# (The http-cache-semantics exception (GHSA-ch52-4w7c-c8xp) went away with its 4.3.0 fix, and the
# sprintf-js one (GHSA-hp3w-g68c-fv3c) once the scanner stopped finding it in the lockfile.)

# Electron 41.x advisories (published October 2026). Same reason for each.

[[IgnoredVulns]]
id = "GHSA-2p8c-gr87-2676"
ignoreUntil = 2026-12-26
reason = "Electron 41 is out of support and has no fixed 41.x release (fixes start in 42.11). Electron is a dev dependency used only to build the desktop apps, which are not in use: releases are paused and nothing is published. The web app and iOS app do not contain Electron. Ignored for 60 days while a move to a supported Electron major is planned; remove when that lands."

