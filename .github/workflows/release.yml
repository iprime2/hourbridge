name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Serialize all release runs so the single publish job never races across builds.
  group: release
  cancel-in-progress: false

jobs:
  # Bump semver on main merges. Skipped for chore(release) commits (loop guard)
  # and for tag pushes (manual / follow-tags events).
  version:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push tag
        id: bump
        run: |
          set -euo pipefail
          MSG="${{ github.event.head_commit.message }}"
          if echo "${MSG}" | grep -qiE '(^|[[:space:]])bump:major([[:space:]]|$)'; then
            BUMP=major
          elif echo "${MSG}" | grep -qiE '(^|[[:space:]])bump:minor([[:space:]]|$)'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "Bumping with npm version ${BUMP}"
          npm version "${BUMP}" -m "chore(release): %s"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git push origin "HEAD:main" --follow-tags
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "Created ${TAG} (${VERSION})"

  quality:
    needs: version
    # Main path: after successful bump. Tag path: manual v* tags only (skip
    # chore(release) tags so --follow-tags does not double-package).
    if: >-
      always() && (
        needs.version.result == 'success' ||
        (
          needs.version.result == 'skipped' &&
          startsWith(github.ref, 'refs/tags/v') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release ref
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ needs.version.result }}" == "success" ]]; then
            TAG="${{ needs.version.outputs.tag }}"
            VERSION="${{ needs.version.outputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "Using tag=${TAG} version=${VERSION}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS + portable)
        if: matrix.platform == 'win'
        run: npm run dist:win

      # Always build AppX with config placeholders (or optional repo secrets) so
      # Partners can download a Store package. Replace identity before submission.
      # AppX requires Windows SDK — windows-latest only (macOS job unchanged).
      - name: Build Windows Store AppX
        if: matrix.platform == 'win'
        env:
          WIN_STORE_IDENTITY_NAME: ${{ secrets.WIN_STORE_IDENTITY_NAME }}
          WIN_STORE_PUBLISHER: ${{ secrets.WIN_STORE_PUBLISHER }}
          WIN_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.WIN_STORE_PUBLISHER_DISPLAY_NAME }}
          WIN_STORE_APPLICATION_ID: ${{ secrets.WIN_STORE_APPLICATION_ID }}
          WIN_STORE_DISPLAY_NAME: ${{ secrets.WIN_STORE_DISPLAY_NAME }}
        run: npm run dist:win:store

      # Signed + notarized when the secrets below exist; otherwise electron-builder.cjs
      # falls back to an unsigned build (empty secrets evaluate to ""), so forks and
      # first-time setups still succeed. See README → "macOS signing & notarization".
      - name: Build macOS DMG + ZIP
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ needs.quality.outputs.version }}
          path: |
            release/WorldTimeBuddy-*-Setup.exe
            release/WorldTimeBuddy-*-portable.exe
            release/WorldTimeBuddy-*-win-store.appx
            release/WorldTimeBuddy-*-win-store.appxupload
          # .appxupload is optional (not always produced); require at least Setup/portable/appx.
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs-${{ needs.quality.outputs.version }}
          path: |
            release/WorldTimeBuddy-*.dmg
            release/WorldTimeBuddy-*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: [quality, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers-${{ needs.quality.outputs.version }}
          path: dist-assets

      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: macos-dmgs-${{ needs.quality.outputs.version }}
          path: dist-assets

      - name: List release assets
        run: ls -la dist-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.quality.outputs.tag }}
          name: ${{ needs.quality.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
