name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Serialize all release runs so the single publish job never races across builds.
  group: release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npm run dist:win

      - name: Build macOS DMG (unsigned)
        if: matrix.platform == 'mac'
        env:
          # Unsigned by default — pipeline succeeds without Apple certs.
          # Optional future secrets: CSC_LINK, CSC_KEY_PASSWORD, Apple ID notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/WorldTimeBuddy-*-Setup.exe
            release/WorldTimeBuddy-*-portable.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs
          path: release/WorldTimeBuddy-*.dmg
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Pure semver tags (vX.Y.Z, no -build / prerelease suffix) are full releases.
            if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              PRERELEASE=false
            else
              PRERELEASE=true
            fi
            NAME="${TAG}"
            BODY="Stable release from tag \`${TAG}\` (commit \`${SHORT_SHA}\`)."
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}-build.${{ github.run_number }}"
            PRERELEASE=true
            NAME="v${VERSION}-build.${{ github.run_number }} (${SHORT_SHA})"
            BODY="Main-branch prerelease from \`package.json\` version \`${VERSION}\`, run #${{ github.run_number }}, commit \`${SHORT_SHA}\`."
          fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "body<<EOF"
            echo "${BODY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved tag=${TAG} name=${NAME} prerelease=${PRERELEASE}"

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist-assets

      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: macos-dmgs
          path: dist-assets

      - name: List release assets
        run: ls -la dist-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
