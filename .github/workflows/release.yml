name: Release

# PAUSED: releases are off while the desktop apps are not in use. Nothing runs on a push to main
# or on a tag, so merging no longer bumps the version, tags, packages or publishes. To resume,
# replace the `on:` block below with the triggers that were here:
#
#   on:
#     push:
#       branches:
#         - main
#       tags:
#         - "v*"
#
# The jobs below are unchanged and still expect those push events.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize all release runs so the single publish job never races across builds.
  group: release
  cancel-in-progress: false

jobs:
  # Bump semver on main merges. Skipped for chore(release) commits (loop guard)
  # and for tag pushes (manual / follow-tags events).
  version:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push tag
        id: bump
        run: |
          set -euo pipefail
          MSG="${{ github.event.head_commit.message }}"
          if echo "${MSG}" | grep -qiE '(^|[[:space:]])bump:major([[:space:]]|$)'; then
            BUMP=major
          elif echo "${MSG}" | grep -qiE '(^|[[:space:]])bump:minor([[:space:]]|$)'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "Bumping with npm version ${BUMP}"
          npm version "${BUMP}" -m "chore(release): %s"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git push origin "HEAD:main" --follow-tags
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "Created ${TAG} (${VERSION})"

  quality:
    needs: version
    # Main path: after successful bump. Tag path: manual v* tags only (skip
    # chore(release) tags so --follow-tags does not double-package).
    if: >-
      always() && (
        needs.version.result == 'success' ||
        (
          needs.version.result == 'skipped' &&
          startsWith(github.ref, 'refs/tags/v') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release ref
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ needs.version.result }}" == "success" ]]; then
            TAG="${{ needs.version.outputs.tag }}"
            VERSION="${{ needs.version.outputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "Using tag=${TAG} version=${VERSION}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build
        run: npm run build

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      # These three decide whether a Store package is built (see "Build Windows Store AppX").
      # `secrets` cannot be used in a step's `if:`, but `env` can, so surface just these here.
      WIN_STORE_IDENTITY_NAME: ${{ secrets.WIN_STORE_IDENTITY_NAME }}
      WIN_STORE_PUBLISHER: ${{ secrets.WIN_STORE_PUBLISHER }}
      WIN_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.WIN_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS + portable)
        if: matrix.platform == 'win'
        run: npm run dist:win

      # The Store package is only built with the real Partner Center identity. Without it the
      # package would carry placeholder values (publisher "CN=ms") and be unsigned, so it could be
      # neither installed nor submitted — attaching it to a release would just be a dead download.
      # PRs still build one with placeholders (ci.yml → win_package) to keep the config working.
      # AppX needs the Windows SDK, so this is windows-latest only.
      - name: Build Windows Store AppX
        if: >-
          matrix.platform == 'win' &&
          env.WIN_STORE_IDENTITY_NAME != '' &&
          env.WIN_STORE_PUBLISHER != '' &&
          env.WIN_STORE_PUBLISHER_DISPLAY_NAME != ''
        env:
          WIN_STORE_APPLICATION_ID: ${{ secrets.WIN_STORE_APPLICATION_ID }}
          WIN_STORE_DISPLAY_NAME: ${{ secrets.WIN_STORE_DISPLAY_NAME }}
        run: npm run dist:win:store

      - name: Note that the Store package was skipped
        if: >-
          matrix.platform == 'win' &&
          (env.WIN_STORE_IDENTITY_NAME == '' ||
          env.WIN_STORE_PUBLISHER == '' ||
          env.WIN_STORE_PUBLISHER_DISPLAY_NAME == '')
        shell: bash
        run: echo "::notice title=Microsoft Store package skipped::Set the WIN_STORE_IDENTITY_NAME, WIN_STORE_PUBLISHER and WIN_STORE_PUBLISHER_DISPLAY_NAME secrets (from Partner Center → Product identity) to build it. See the README."

      # Signed + notarized when the secrets below exist; otherwise electron-builder.cjs
      # falls back to an unsigned build (empty secrets evaluate to ""), so forks and
      # first-time setups still succeed. See README → "macOS signing & notarization".
      - name: Build macOS DMG + ZIP
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ needs.quality.outputs.version }}
          path: |
            release/Hourbridge-*-Setup.exe
            release/Hourbridge-*-portable.exe
            release/Hourbridge-*-win-store.appx
            release/Hourbridge-*-win-store.appxupload
          # The .appx exists only when the Store secrets are set, and .appxupload is not always
          # produced; the installer and portable .exe are always there, so this still fails on a bad build.
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs-${{ needs.quality.outputs.version }}
          path: |
            release/Hourbridge-*.dmg
            release/Hourbridge-*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: [quality, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers-${{ needs.quality.outputs.version }}
          path: dist-assets

      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: macos-dmgs-${{ needs.quality.outputs.version }}
          path: dist-assets

      - name: List release assets
        run: ls -la dist-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.quality.outputs.tag }}
          name: ${{ needs.quality.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
